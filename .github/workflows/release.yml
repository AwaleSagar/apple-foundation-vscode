name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Create release PR or tag release
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          publish: pnpm exec changeset tag
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package VSIX
        if: steps.changesets.outputs.published == 'true'
        run: pnpm run package

      - name: Attach VSIX to GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="apple-foundation-vscode@${version}"
          # `changeset tag` creates the git tag but not a GitHub release, so
          # create the release from the tag if it does not already exist.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" ./*.vsix --clobber

      # Marketplace publishing is intentionally a manual gate until the
      # publisher account is provisioned. See docs/release-process.md.
      # - name: Publish to Marketplace
      #   if: steps.changesets.outputs.published == 'true'
      #   run: pnpm exec vsce publish --no-dependencies --target darwin-arm64 -p ${{ secrets.VSCE_PAT }}
